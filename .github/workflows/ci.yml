# ─────────────────────────────────────────────────────────────────────────────
# SEBA AI Studio — Continuous Integration
# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push and pull request.
# Validates code quality, type safety, test coverage, and build integrity.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # ─── Type Check ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

  # ─── Unit & Integration Tests ───────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:ci -- --coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
        continue-on-error: true  # Don't fail CI if Coveralls is unreachable

  # ─── i18n Parity Gates ─────────────────────────────────────────────────────
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: i18n key parity (CA/ES/EN)
        run: pnpm vitest run server/i18n.parity.test.ts
        env:
          NODE_ENV: test

      - name: i18n language switching
        run: pnpm vitest run server/i18n.switching.test.ts
        env:
          NODE_ENV: test

      - name: i18n placeholder parity
        run: pnpm vitest run server/i18n.placeholders.test.ts
        env:
          NODE_ENV: test

  # ─── Build Verification ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, i18n]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm vite build client
        env:
          VITE_APP_ID: "ci-build"
          VITE_APP_TITLE: "SEBA AI Studio"
          VITE_APP_LOGO: ""
          VITE_OAUTH_PORTAL_URL: "https://login.example.com"
          VITE_FRONTEND_FORGE_API_KEY: "ci-build-key"
          VITE_FRONTEND_FORGE_API_URL: "https://forge.example.com"
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""

      - name: Verify build output
        run: |
          echo "✅ Client build successful"
          ls -la client/dist/ | head -20
          echo ""
          echo "Bundle size:"
          du -sh client/dist/

  # ─── Security Audit ─────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true  # Report vulnerabilities without blocking
